<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>100 Girlfriends</title>
<link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Fredoka:wght@600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--pink:#e8456b;--soft:#ffd6e2;--bg1:#fff1f5;--bg2:#ffc9d8;--ink:#7a1f3d}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--bg1),var(--bg2));background-attachment:fixed;overflow-x:hidden}
.hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.hearts i{position:absolute;bottom:-40px;font-style:normal;color:var(--pink);opacity:.5;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh) rotate(25deg)}}
@media (prefers-reduced-motion:reduce){.hearts i{animation:none;bottom:auto;top:calc(var(--y) * 1%)}}
.wrap{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:30px 18px 60px;text-align:center}
h1{position:relative;display:inline-block;max-width:100%;margin:10px 0 26px;line-height:1.02;font-weight:400;
 }
h1 .row{display:flex;justify-content:center;align-items:flex-end;flex-wrap:wrap;gap:.25em}
h1 .c{display:inline-block;color:#ee5f8c;animation:shade 2.4s ease-in-out infinite;animation-delay:calc(var(--i) * -.2s)}
@keyframes shade{0%,100%{color:#ee5f8c}50%{color:#f7a9c0}}
h1 small{font:400 clamp(1rem,3.6vw,1.7rem)/1 "Rozha One",Georgia,serif;color:#ee5f8c;padding-bottom:.35em}
h1 .big{font:400 clamp(3rem,13vw,6rem)/1 "Rozha One",Georgia,serif;white-space:nowrap}
h1 .l2{display:block;font:400 clamp(.95rem,3.8vw,1.6rem)/1.15 "Rozha One",Georgia,serif;margin:.15em 0 .05em}
h1 .really{font:700 clamp(2.4rem,10vw,5rem)/.95 Fredoka,"Arial Rounded MT Bold",system-ui,sans-serif;letter-spacing:.01em}
h1 .love{font:400 clamp(2.7rem,11.5vw,5.8rem)/.95 "Rozha One",Georgia,serif;white-space:nowrap}
h1 .hole{position:relative}
h1 .hole::after{content:"\2665\FE0E";position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);font:400 .4em/1 system-ui,sans-serif;color:#fff;-webkit-text-stroke:0}
h1 .love .hole::after{font-size:.28em;top:60%}
h1 .hh{position:absolute;color:#ffab2e;font:400 clamp(1.4rem,5vw,2.4rem)/1 system-ui,sans-serif;pointer-events:none}
@media (prefers-reduced-motion:reduce){h1 .c{animation:none}h1 .c:nth-child(even){color:#f7a9c0}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:16px}
.card{background:#fff;border:3px solid #fff;border-radius:16px;overflow:hidden;cursor:pointer;text-align:left;padding:0;font-family:inherit;color:var(--ink);box-shadow:0 3px 12px rgba(232,69,107,.22);display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(232,69,107,.35)}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--soft);display:block}
.card .meta{padding:10px 12px 12px}
.card b{display:block;font-size:1rem;line-height:1.2}
.card span{font-size:.82rem;color:var(--pink);font-weight:700}
@media (prefers-reduced-motion:reduce){.card:hover{transform:none}}
.playbar{display:none;align-items:center;gap:10px;justify-content:center;margin-top:6px}
.playbar.on{display:flex}
.playbar strong{font-size:1.2rem}
.tabs{display:inline-flex;gap:8px;margin-bottom:16px}
.tab{border:3px solid #fff;background:rgba(255,255,255,.55);color:var(--pink);padding:9px 24px;border-radius:999px;font:800 1.05rem Nunito,sans-serif;cursor:pointer;box-shadow:0 3px 10px rgba(232,69,107,.2)}
.tab[aria-selected=true]{background:var(--pink);color:#fff}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.bar input[type=search],.bar input[type=url]{flex:1 1 260px;padding:14px 18px;font:700 1.05rem Nunito,sans-serif;border:3px solid #fff;border-radius:999px;background:rgba(255,255,255,.85);color:var(--ink);box-shadow:0 3px 10px rgba(232,69,107,.18)}
.go{background:var(--pink);color:#fff;border:3px solid #fff;border-radius:999px;padding:0 26px;min-height:50px;font:800 1rem Nunito,sans-serif;cursor:pointer;box-shadow:0 3px 10px rgba(232,69,107,.3);text-decoration:none;display:inline-flex;align-items:center}
.engines{display:flex;gap:18px;justify-content:center;margin:12px 0 0;font-weight:800}
.engines label{cursor:pointer}
.frame{width:100%;height:72vh;border:4px solid #fff;border-radius:18px;background:#fff;margin-top:16px;box-shadow:0 8px 24px rgba(232,69,107,.25);display:none}
.frame.on{display:block}
.note{font-size:.92rem;margin-top:10px;opacity:.85;font-weight:600}
[hidden]{display:none!important}
.top{position:sticky;top:0;z-index:5;background:#1c1c1c;color:#fff;font-family:"Segoe UI",system-ui,sans-serif}
.tabstrip{display:flex;align-items:flex-end;gap:6px;padding:6px 8px 0}
.tabstrip .menu{width:30px;height:30px;border-radius:8px;background:#2f2f2f;color:#ddd;display:grid;place-items:center;margin-bottom:4px;font-size:.8rem}
.tabstrip .tabitem{display:flex;align-items:center;gap:8px;background:#2b2b2b;border-radius:10px 10px 0 0;padding:8px 10px 8px 12px;font-size:.85rem;min-width:0;max-width:240px}
.tabstrip .tabitem i{font-style:normal;color:#ee5f8c}
.tabstrip .tabitem span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabstrip .tabitem u{text-decoration:none;color:#aaa;margin-left:6px}
.toolbar{background:#2b2b2b;padding:6px 10px}
.toolbar form{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:6px}
.nb{width:34px;height:34px;border:0;border-radius:50%;background:transparent;color:#e8e8e8;display:grid;place-items:center;cursor:pointer;flex:none}
.nb:hover{background:#3d3d3d}
.nb svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.addr{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:#1c1c1c;border-radius:10px;padding:0 6px 0 12px;border:1px solid transparent}
.addr:focus-within{border-color:#ee5f8c}
.addr svg{width:15px;height:15px;stroke:#bbb;fill:none;stroke-width:2;flex:none}
.addr input{flex:1;min-width:0;background:transparent;border:0;color:#fff;font:400 .95rem "Segoe UI",system-ui,sans-serif;padding:9px 0;outline:0}
.addr input::placeholder{color:#9a9a9a}
.addr select{background:#2f2f2f;color:#e8e8e8;border:0;border-radius:7px;font:600 .8rem "Segoe UI",system-ui,sans-serif;padding:5px 6px;cursor:pointer}
.sr{position:absolute;left:-9999px}
</style>
</head>
<body>
<div class="hearts" id="hearts" aria-hidden="true"></div>
<header class="top">
  <div class="tabstrip" aria-hidden="true">
    <div class="menu">&#8964;</div>
    <div class="tabitem"><i>&#9829;&#xFE0E;</i><span>100 Girlfriends</span><u>&#215;</u></div>
  </div>
  <div class="toolbar"><form id="sform">
    <button class="nb" type="button" id="nback" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
    <button class="nb" type="button" id="nfwd" aria-label="Forward"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    <button class="nb" type="button" id="nreload" aria-label="Reload"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7M20 4v5h-5"/></svg></button>
    <div class="addr">
      <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      <input id="q" type="text" placeholder="Search or enter a link" aria-label="Search or enter a link" autocomplete="off" spellcheck="false">
      <select id="eng" aria-label="Search engine"><option value="brave">Brave</option><option value="ddg">DuckDuckGo</option></select>
    </div>
    <button class="sr" type="submit">Go</button>
  </form></div>
</header>
<div class="wrap">
  <h1 id="title" aria-label="100 Girlfriends">
    <span class="hh" style="left:2%;top:4%" aria-hidden="true">&#9829;&#xFE0E;</span>
    <span class="hh" style="right:6%;top:-4%" aria-hidden="true">&#9829;&#xFE0E;</span>
    <span class="hh" style="right:-2%;bottom:14%" aria-hidden="true">&#9829;&#xFE0E;</span>
    <span class="row"><span class="big fx" aria-hidden="true">100</span></span>
    <span class="row"><span class="big fx" aria-hidden="true">Girlfriends</span></span>
  </h1>
  <section id="p-search">
    <p class="note" id="snote"></p>
    <div id="results" hidden>
      <div class="playbar on"><button class="go" id="closeres" type="button">Close results</button></div>
      <iframe class="frame on" id="sframe" title="Web page" allow="fullscreen"></iframe>
    </div>
  </section>

  <section id="p-games">
    <div id="listview">
      <form class="bar" onsubmit="return false">
        <input id="gfilter" type="search" placeholder="Find a game" aria-label="Find a game">
      </form>
      <p class="note" id="gstatus">Loading games...</p>
      <div class="grid" id="grid"></div>
      <p><button class="go" id="more" type="button" hidden>Show more</button></p>
    </div>
    <div class="playbar" id="playbar">
      <button class="go" id="back" type="button">Back to games</button>
      <strong id="ptitle"></strong>
      <button class="go" id="full" type="button">Fullscreen</button>
    </div>
    <iframe class="frame" id="gframe" title="Game" sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-forms allow-popups allow-modals" allowfullscreen allow="fullscreen; gamepad; autoplay"></iframe>
  </section>
</div>

<script>
/* ===== EDIT THESE ===== */
window.PROXY_MODE=false; // the server turns this on
const PROXY_MODE = window.PROXY_MODE === true;
const VIA = u => PROXY_MODE ? "/raw?url=" + encodeURIComponent(u) : u;

// Game catalog. The page tries each source in order until one loads, so the game
// list, covers and game files always come from the same matching source.
const SOURCES = [
  { zones:"https://cdn.jsdelivr.net/gh/gn-math/assets@main/zones.json",
    cover:"https://cdn.jsdelivr.net/gh/gn-math/covers@main", html:"https://cdn.jsdelivr.net/gh/gn-math/html@main" },
  { zones:"https://cdn.jsdelivr.net/gh/gn-math/assets@latest/zones.json",
    cover:"https://cdn.jsdelivr.net/gh/gn-math/covers@main", html:"https://cdn.jsdelivr.net/gh/gn-math/html@main" },
  { zones:"https://cdn.jsdelivr.net/gh/freebuisness/assets@main/zones.json",
    cover:"https://cdn.jsdelivr.net/gh/freebuisness/covers@main", html:"https://cdn.jsdelivr.net/gh/freebuisness/html@main" }
];
const PAGE_SIZE = 60;
/* ====================== */

const ENGINES = {
  brave: q => "https://search.brave.com/search?q=" + encodeURIComponent(q),
  ddg:   q => "https://html.duckduckgo.com/html/?q=" + encodeURIComponent(q)
};
const $ = id => document.getElementById(id);

// title: letters shift between two pinks in a wave; the zeros and the "o" get a heart
(function(){
  let i = 0;
  document.querySelectorAll("#title .fx").forEach(el => {
    const txt = el.textContent; el.textContent = "";
    [...txt].forEach(ch => {
      if (ch === " ") { el.appendChild(document.createTextNode(" ")); return; }
      const s = document.createElement("span");
      s.className = "c" + (ch === "0" || (ch === "o" && el.classList.contains("love")) ? " hole" : "");
      s.style.setProperty("--i", i++); s.textContent = ch;
      el.appendChild(s);
    });
  });
})();

// background hearts
(function(){
  const h = $("hearts"), glyphs = ["♥","♡"];
  for (let i = 0; i < 22; i++) {
    const s = document.createElement("i");
    s.textContent = glyphs[i % 2];
    s.style.left = Math.random()*100 + "%";
    s.style.fontSize = (12 + Math.random()*26) + "px";
    s.style.animationDuration = (9 + Math.random()*12) + "s";
    s.style.animationDelay = (-Math.random()*20) + "s";
    s.style.setProperty("--y", Math.random()*100);
    h.appendChild(s);
  }
})();


$("closeres").onclick = () => { $("sframe").src = "about:blank"; $("results").hidden = true; $("p-games").hidden = false; };

// browser-style buttons and address display
const frameWin = () => { try { return $("sframe").contentWindow; } catch (e) { return null; } };
$("nback").onclick   = () => { const w = frameWin(); if (w && !$("results").hidden) w.history.back(); };
$("nfwd").onclick    = () => { const w = frameWin(); if (w && !$("results").hidden) w.history.forward(); };
$("nreload").onclick = () => { const w = frameWin(); if (w && !$("results").hidden) w.location.reload(); };
$("sframe").addEventListener("load", () => {
  try {
    const u = new URL($("sframe").contentWindow.location.href).searchParams.get("url");
    if (u && document.activeElement !== $("q")) $("q").value = u;
  } catch (e) { /* blank frame */ }
});

// search bar (always at the top)
function toTarget(text){
  if (/^https?:\/\//i.test(text)) return text;
  if (/^[^\s]+\.[a-z]{2,}(\/\S*)?$/i.test(text)) return "https://" + text;
  return ENGINES[$("eng").value](text);
}
$("sform").addEventListener("submit", e => {
  e.preventDefault();
  const t = $("q").value.trim(); if (!t) return;
  if (!PROXY_MODE) {
    $("snote").textContent = "The proxy server isn't running. Start it with: node server.js, then open this page from that address.";
    return;
  }
  $("snote").textContent = "";
  closeGame();
  $("p-games").hidden = true;
  $("sframe").src = "/go?url=" + encodeURIComponent(toTarget(t));
  $("results").hidden = false;
  $("results").scrollIntoView({ behavior: "smooth", block: "start" });
});

// games: load the real catalog, show covers, fetch the game only when clicked
let SRC = null, ALL = [], shown = 0, current = [];
const fill = (u, src) => u.replace("{COVER_URL}", src.cover).replace("{HTML_URL}", src.html);

async function loadCatalog(){
  $("gstatus").textContent = "Loading games...";
  for (const src of SOURCES) {
    try {
      const r = await fetch(VIA(src.zones));
      if (!r.ok) continue;
      const data = await r.json();
      ALL = data.filter(z => z && z.id >= 0 && z.name && z.url)
                .sort((x, y) => x.name.localeCompare(y.name));
      if (ALL.length) { SRC = src; break; }
    } catch (e) { /* try next source */ }
  }
  if (!SRC) {
    $("gstatus").innerHTML = 'Could not load the games list. <button class="go" id="retry" type="button">Try again</button>';
    $("retry").onclick = loadCatalog; return;
  }
  $("gstatus").textContent = ALL.length + " games";
  applyFilter();
}

function applyFilter(){
  const f = $("gfilter").value.trim().toLowerCase();
  current = ALL.filter(z => z.name.toLowerCase().includes(f));
  $("grid").innerHTML = ""; shown = 0; renderMore();
  if (!current.length) $("gstatus").textContent = "No games match that search.";
  else $("gstatus").textContent = current.length + " games";
}
function renderMore(){
  current.slice(shown, shown + PAGE_SIZE).forEach(z => {
    const b = document.createElement("button");
    b.className = "card"; b.type = "button";
    const img = document.createElement("img");
    img.loading = "lazy"; img.alt = ""; img.src = VIA(fill(z.cover || "", SRC));
    img.onerror = () => { img.removeAttribute("src"); };
    const m = document.createElement("div"); m.className = "meta";
    const t = document.createElement("b"); t.textContent = z.name; m.appendChild(t);
    if (z.author) { const a = document.createElement("span"); a.textContent = z.author; m.appendChild(a); }
    b.append(img, m);
    b.onclick = () => play(z);
    $("grid").appendChild(b);
  });
  shown = Math.min(shown + PAGE_SIZE, current.length);
  $("more").hidden = shown >= current.length;
}

async function play(z){
  const url = fill(z.url, SRC);
  $("ptitle").textContent = z.name;
  $("listview").hidden = true; $("playbar").classList.add("on");
  const f = $("gframe"); f.classList.add("on");
  f.srcdoc = "<body style='font-family:sans-serif;color:#7a1f3d;text-align:center;padding-top:20vh'>Loading " + z.name.replace(/[<&]/g,"") + "...</body>";
  try {
    const r = await fetch(VIA(url));
    if (!r.ok) throw new Error(r.status);
    f.srcdoc = await r.text();
  } catch (e) {
    f.removeAttribute("srcdoc");
    f.srcdoc = "<body style='font-family:sans-serif;color:#7a1f3d;text-align:center;padding:20vh 20px 0'>This game could not be loaded. Go back and try another one.</body>";
  }
}
function closeGame(){
  $("gframe").srcdoc = ""; $("gframe").classList.remove("on");
  $("listview").hidden = false; $("playbar").classList.remove("on");
}
$("back").onclick = closeGame;
$("full").onclick = () => { const f = $("gframe"); (f.requestFullscreen || f.webkitRequestFullscreen).call(f); };
$("more").onclick = renderMore;
$("gfilter").addEventListener("input", applyFilter);
loadCatalog();
</script>
</body>
</html>
