<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>100 Girlfriends</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,900,100&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Fredoka:wght@600;700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--pink:#e8456b;--soft:#ffd6e2;--bg1:#fff1f5;--bg2:#ffc9d8;--ink:#7a1f3d}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--bg1),var(--bg2));background-attachment:fixed;overflow-x:hidden}
.hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.hearts i{position:absolute;bottom:-40px;font-style:normal;color:var(--pink);opacity:.5;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh) rotate(25deg)}}
@media (prefers-reduced-motion:reduce){.hearts i{animation:none;bottom:auto;top:calc(var(--y) * 1%)}}
.wrap{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:30px 18px 100px;text-align:center}
h1{position:relative;display:inline-block;max-width:100%;margin:10px 0 26px;line-height:1.02;font-weight:400;
 }
h1 .row{display:flex;justify-content:center;align-items:baseline;flex-wrap:wrap;gap:.25em}
h1 .c{display:inline-block;color:#ee5f8c;animation:shade 2.4s ease-in-out infinite;animation-delay:calc(var(--i) * -.2s)}
@keyframes shade{0%,100%{color:#ee5f8c}50%{color:#f7a9c0}}
h1 small{font:400 clamp(1rem,3.6vw,1.7rem)/1 "Rozha One",Georgia,serif;color:#ee5f8c;padding-bottom:.35em}
h1 .num,h1 .big{font-family:Fraunces,"Rozha One",Georgia,"Times New Roman",serif;font-weight:900;font-size:clamp(2.8rem,11.5vw,5.8rem);line-height:1;letter-spacing:-.015em;font-variation-settings:"SOFT" 100;font-optical-sizing:auto;white-space:nowrap}
h1 .l2{display:block;font:400 clamp(.95rem,3.8vw,1.6rem)/1.15 "Rozha One",Georgia,serif;margin:.15em 0 .05em}
h1 .really{font:700 clamp(2.4rem,10vw,5rem)/.95 Fredoka,"Arial Rounded MT Bold",system-ui,sans-serif;letter-spacing:.01em}
h1 .love{font:400 clamp(2.7rem,11.5vw,5.8rem)/.95 "Rozha One",Georgia,serif;white-space:nowrap}
.title-art{display:block;width:clamp(200px,52vw,330px);height:auto;margin:-.35em auto 0;position:relative;pointer-events:none;filter:drop-shadow(0 4px 8px rgba(232,69,107,.25))}
h1 .hh{position:absolute;color:#ffab2e;font:400 clamp(1.4rem,5vw,2.4rem)/1 system-ui,sans-serif;pointer-events:none}
@media (prefers-reduced-motion:reduce){h1 .c{animation:none}h1 .c:nth-child(even){color:#f7a9c0}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:16px}
.card{background:#fff;border:3px solid #fff;border-radius:16px;overflow:hidden;cursor:pointer;text-align:left;padding:0;font-family:inherit;color:var(--ink);box-shadow:0 3px 12px rgba(232,69,107,.22);display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(232,69,107,.35)}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--soft);display:block}
.card .meta{padding:10px 12px 12px}
.card b{display:block;font-size:1rem;line-height:1.2}
.card span{font-size:.82rem;color:var(--pink);font-weight:700}
@media (prefers-reduced-motion:reduce){.card:hover{transform:none}}
.playbar{display:none;align-items:center;gap:10px;justify-content:center;margin-top:6px}
.playbar.on{display:flex}
.playbar strong{font-size:1.2rem}
.tabs{display:inline-flex;gap:8px;margin-bottom:16px}
.tab{border:3px solid #fff;background:rgba(255,255,255,.55);color:var(--pink);padding:9px 24px;border-radius:999px;font:800 1.05rem Nunito,sans-serif;cursor:pointer;box-shadow:0 3px 10px rgba(232,69,107,.2)}
.tab[aria-selected=true]{background:var(--pink);color:#fff}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.bar input[type=search],.bar input[type=url]{flex:1 1 260px;padding:14px 18px;font:700 1.05rem Nunito,sans-serif;border:3px solid #fff;border-radius:999px;background:rgba(255,255,255,.85);color:var(--ink);box-shadow:0 3px 10px rgba(232,69,107,.18)}
.go{background:var(--pink);color:#fff;border:3px solid #fff;border-radius:999px;padding:0 26px;min-height:50px;font:800 1rem Nunito,sans-serif;cursor:pointer;box-shadow:0 3px 10px rgba(232,69,107,.3);text-decoration:none;display:inline-flex;align-items:center}
.engines{display:flex;gap:18px;justify-content:center;margin:12px 0 0;font-weight:800}
.engines label{cursor:pointer}
.frame{width:100%;height:72vh;border:4px solid #fff;border-radius:18px;background:#fff;margin-top:16px;box-shadow:0 8px 24px rgba(232,69,107,.25);display:none}
.frame.on{display:block}
body.playing{overflow:hidden}
body.playing .wrap{padding:0}
body.playing .wrap>h1,body.playing .tagline,body.playing .exitbtn{display:none}
body.playing #playbar{position:fixed;left:0;right:0;top:var(--hdr,91px);height:50px;margin:0;padding:0 8px;z-index:12;background:rgba(255,241,245,.97);gap:8px}
body.playing #playbar .go{min-height:38px;padding:0 16px;font-size:.92rem}
body.playing #playbar strong{font-size:1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
body.playing #gframe{position:fixed;left:0;right:0;top:calc(var(--hdr,91px) + 50px);width:100%;height:calc(100vh - var(--hdr,91px) - 104px);height:calc(100dvh - var(--hdr,91px) - 104px);margin:0;border:0;border-radius:0;box-shadow:none;z-index:11}
.tagline{margin:-14px 0 22px;min-height:1.6em;font:800 clamp(.95rem,3.4vw,1.15rem)/1.4 Nunito,system-ui,sans-serif;color:var(--pink);letter-spacing:.01em;transition:opacity .45s}
.tagline.out{opacity:0}
@media (prefers-reduced-motion:reduce){.tagline{transition:none}}
.note{font-size:.92rem;margin-top:10px;opacity:.85;font-weight:600}
[hidden]{display:none!important}
.top{position:sticky;top:0;z-index:5;background:#1c1c1c;color:#fff;font-family:"Segoe UI",system-ui,sans-serif}
.tabstrip{display:flex;align-items:flex-end;gap:6px;padding:6px 8px 0}
.tabstrip .menu{width:30px;height:30px;border-radius:8px;background:#2f2f2f;color:#ddd;display:grid;place-items:center;margin-bottom:4px;font-size:.8rem}
.tabstrip .tabitem{display:flex;align-items:center;gap:8px;background:#2b2b2b;border-radius:10px 10px 0 0;padding:8px 10px 8px 12px;font-size:.85rem;min-width:0;max-width:240px}
.tabstrip .tabitem i{font-style:normal;color:#ee5f8c}
.tabstrip .tabitem span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabstrip .tabitem u{text-decoration:none;color:#aaa;margin-left:6px}
.toolbar{background:#2b2b2b;padding:6px 10px}
.toolbar form{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:6px}
.nb{width:34px;height:34px;border:0;border-radius:50%;background:transparent;color:#e8e8e8;display:grid;place-items:center;cursor:pointer;flex:none}
.nb:hover{background:#3d3d3d}
.nb svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.addr{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:#1c1c1c;border-radius:10px;padding:0 6px 0 12px;border:1px solid transparent}
.addr:focus-within{border-color:#ee5f8c}
.addr svg{width:15px;height:15px;stroke:#bbb;fill:none;stroke-width:2;flex:none}
.addr input{flex:1;min-width:0;background:transparent;border:0;color:#fff;font:400 .95rem "Segoe UI",system-ui,sans-serif;padding:9px 0;outline:0}
.addr input::placeholder{color:#9a9a9a}
.addr select{background:#2f2f2f;color:#e8e8e8;border:0;border-radius:7px;font:600 .8rem "Segoe UI",system-ui,sans-serif;padding:5px 6px;cursor:pointer}
.sr{position:absolute;left:-9999px}
.home{display:flex;flex-wrap:wrap;justify-content:center;gap:22px 14px;max-width:760px;margin:14px auto 0}
.home .tile{width:110px}
.tile{background:none;border:0;cursor:pointer;font:800 .95rem Nunito,sans-serif;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:8px;padding:4px}
.tile i img{width:56px;height:56px;border-radius:12px;object-fit:contain}
.tile i{font-style:normal;width:74px;height:74px;border-radius:22px;display:grid;place-items:center;color:#fff;font:800 1.9rem Nunito,sans-serif;box-shadow:0 4px 12px rgba(232,69,107,.25)}
@media (prefers-reduced-motion:no-preference){.tile i{transition:transform .12s}.tile:hover i{transform:translateY(-3px)}}
.taskbar{position:fixed;left:0;right:0;bottom:0;height:54px;z-index:20;background:rgba(32,32,32,.9);backdrop-filter:blur(14px);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;color:#fff;font-family:"Segoe UI",system-ui,sans-serif;border-top:1px solid #3a3a3a}
.tb-center{grid-column:2;display:flex;align-items:center;gap:2px;max-width:100vw;overflow-x:auto;scrollbar-width:none}
.tb-btn{position:relative;width:44px;height:44px;flex:none;border:0;border-radius:8px;background:transparent;display:grid;place-items:center;cursor:pointer;color:#fff}
.tb-btn:hover{background:rgba(255,255,255,.1)}
.tb-btn.on::after{content:"";position:absolute;bottom:2px;left:50%;width:14px;height:3px;border-radius:2px;background:#ee5f8c;transform:translateX(-50%)}
.tbi{font-style:normal;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font:800 .8rem Nunito,sans-serif}
.tbi img{width:24px;height:24px;border-radius:6px;object-fit:contain}
.tb-search{display:flex;align-items:center;gap:8px;flex:none;height:34px;width:190px;margin:0 6px;padding:0 14px;border:1px solid #444;border-radius:999px;background:#2b2b2b;color:#ddd;font:400 .85rem "Segoe UI",system-ui,sans-serif;cursor:pointer}
.tb-search svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.tb-right{grid-column:3;justify-self:end;padding-right:14px;text-align:right;font-size:.74rem;line-height:1.3;white-space:nowrap}
@media (max-width:760px){.tb-search{display:none}.taskbar{grid-template-columns:1fr}.tb-right{display:none}.tb-center{grid-column:1;justify-content:flex-start;padding-left:6px}}
#startmenu{position:fixed;left:50%;bottom:62px;transform:translateX(-50%);width:min(620px,94vw);max-height:68vh;background:rgba(36,36,36,.97);backdrop-filter:blur(18px);border:1px solid #444;border-radius:14px;padding:16px;z-index:25;color:#fff;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 40px rgba(0,0,0,.45);font-family:"Segoe UI",system-ui,sans-serif}
#startmenu input{padding:10px 14px;border-radius:999px;border:1px solid #555;background:#1c1c1c;color:#fff;font:400 .95rem "Segoe UI",system-ui,sans-serif;outline:0}
.smlabel{font-size:.8rem;color:#bbb;font-weight:600}
.smgrid{overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px}
.smitem{display:flex;align-items:center;gap:10px;background:transparent;border:0;color:#fff;text-align:left;padding:6px;border-radius:8px;cursor:pointer;font:400 .88rem "Segoe UI",system-ui,sans-serif}
.smitem:hover{background:rgba(255,255,255,.1)}
.smitem img{width:38px;height:38px;border-radius:8px;object-fit:cover;background:#444;flex:none}
.tile i,.tbi{overflow:hidden}
.tile i svg,.tbi svg{display:block}
@media (max-width:520px){.home{gap:18px 6px}.home .tile{width:calc(33.333% - 6px)}.tile i{width:64px;height:64px;border-radius:18px}}
.exitbtn{position:fixed;left:14px;top:104px;z-index:15;display:flex;align-items:center;gap:8px;padding:9px 16px 9px 12px;border:3px solid #fff;border-radius:999px;background:#ee5f8c;color:#fff;font:800 .95rem Nunito,sans-serif;cursor:pointer;box-shadow:0 3px 12px rgba(232,69,107,.35)}
.exitbtn svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.exitbtn:hover{background:#e0467a}
</style>
</head>

// Logo for each app: the site's own real icon (fetched by your server) when available,
// otherwise a drawn stand-in, otherwise the letter.
function iconInto(el, name, domain){
  const svg = LOGOS[name];
  if (svg) {
    el.textContent = ""; el.style.background = "transparent";
    el.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%" aria-hidden="true">' + svg + '</svg>';
    return;   // vector logo is already sharp at any size; no blurry favicon swap
  }
  if (!domain) return;
  const srcs = (PROXY_MODE ? ["/icon?d=" + encodeURIComponent(domain)] : [])
    .concat(["https://www.google.com/s2/favicons?domain=" + encodeURIComponent(domain) + "&sz=128"]);
  const next = () => {
    const src = srcs.shift(); if (!src) return;
    const img = new Image(); img.alt = "";
    img.onload = () => {
      if (img.naturalWidth < 32) { next(); return; }   // ignore the tiny generic globe icon
      el.textContent = ""; el.style.background = "#fff"; el.appendChild(img);
    };
    img.onerror = next;
    img.src = src;
  };
  next();
}

// games: load the real catalog, show covers, fetch the game only when clicked
let SRC = null, ALL = [], shown = 0, current = [];
const fill = (u, src) => src ? u.replace("{COVER_URL}", src.cover).replace("{HTML_URL}", src.html) : u;
const coverOf = z => z.local ? z.cover : VIA(fill(z.cover || "", SRC));

async function loadCatalog(){
  $("gstatus").textContent = "Loading games...";
  for (const src of SOURCES) {
    try {
      const r = await fetch(VIA(src.zones));
      if (!r.ok) continue;
      const data = await r.json();
      ALL = data.filter(z => z && z.id >= 0 && z.name && z.url)
                .sort((x, y) => x.name.localeCompare(y.name));
      if (ALL.length) { SRC = src; break; }
    } catch (e) { /* try next source */ }
  }
  if (!SRC) {   // full list unavailable: still show the games you host yourself
    ALL = LOCAL_GAMES.slice(); applyFilter();
    $("gstatus").innerHTML = 'Could not load the full games list. <button class="go" id="retry" type="button">Try again</button>';
    $("retry").onclick = loadCatalog;
    if (!$("startmenu").hidden) renderStart();
    return;
  }
  ALL = LOCAL_GAMES.concat(ALL);
  $("gstatus").textContent = ALL.length + " games";
  applyFilter();
  if (!$("startmenu").hidden) renderStart();
}

function applyFilter(){
  const f = $("gfilter").value.trim().toLowerCase();
  current = ALL.filter(z => z.name.toLowerCase().includes(f));
  $("grid").innerHTML = ""; shown = 0; renderMore();
  if (!current.length) $("gstatus").textContent = "No games match that search.";
  else $("gstatus").textContent = current.length + " games";
}
function renderMore(){
  current.slice(shown, shown + PAGE_SIZE).forEach(z => {
    const b = document.createElement("button");
    b.className = "card"; b.type = "button";
    const img = document.createElement("img");
    img.loading = "lazy"; img.alt = ""; img.src = coverOf(z);
    img.onerror = () => { img.removeAttribute("src"); };
    const m = document.createElement("div"); m.className = "meta";
    const t = document.createElement("b"); t.textContent = z.name; m.appendChild(t);
    if (z.author) { const a = document.createElement("span"); a.textContent = z.author; m.appendChild(a); }
    b.append(img, m);
    b.onclick = () => play(z);
    $("grid").appendChild(b);
  });
  shown = Math.min(shown + PAGE_SIZE, current.length);
  $("more").hidden = shown >= current.length;
}

const viaCdn = html => window.CDN_VIA_PROXY === true ? html.replace(/https:\/\/(?:cdnjs\.cloudflare\.com|cdn\.jsdelivr\.net|unpkg\.com)\/[^"'\s)\\]+/g, u => "/raw?url=" + encodeURIComponent(u)) : html;
async function play(z){
  showOnly("games"); sizeHdr(); document.body.classList.add("playing");
  const url = fill(z.url, SRC);
  $("ptitle").textContent = z.name;
  $("listview").hidden = true; $("playbar").classList.add("on");
  const f = $("gframe"); f.classList.add("on");
  f.srcdoc = "<body style='font-family:sans-serif;color:#7a1f3d;text-align:center;padding-top:20vh'>Loading " + z.name.replace(/[<&]/g,"") + "...</body>";
  try {
    let txt;
    const emb = z.local && window.GAME_DATA && window.GAME_DATA[z.id];
    if (emb) txt = new TextDecoder().decode(Uint8Array.from(atob(emb), c => c.charCodeAt(0)));
    else {
      const r = await fetch(z.local ? url : VIA(url));
      if (!r.ok) throw new Error("HTTP " + r.status + " for " + url);
      txt = await r.text();
    }
    f.onload = () => { try { f.focus(); } catch (e) {} };
    f.srcdoc = z.local ? viaCdn(txt) : txt;
  } catch (e) {
    f.removeAttribute("srcdoc");
    f.srcdoc = "<body style='font-family:sans-serif;color:#7a1f3d;text-align:center;padding:20vh 20px 0'>This game could not be loaded (" + String((e && e.message) || e).replace(/[<&]/g,"") + "). Go back and try another one.</body>";
  }
}
